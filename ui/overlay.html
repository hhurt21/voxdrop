<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxDrop HUD</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
        color: #f2f3f5;
        user-select: none;
      }
      .hud {
        margin: 6px;
        background: rgba(30, 31, 34, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        padding: 9px 13px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hud.speaking {
        border-color: rgba(88, 101, 242, 0.9);
      }
      .hud.listening {
        border-color: rgba(35, 165, 90, 0.65);
      }
      .hud.sleeping {
        border-color: rgba(240, 178, 50, 0.75);
      }
      .hud-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        cursor: move;
      }
      .state-group {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 700;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #72767d;
        flex-shrink: 0;
      }
      .hud.listening .dot {
        background: #23a55a;
      }
      .hud.speaking .dot {
        background: #5865f2;
        box-shadow: 0 0 8px #5865f2;
      }
      .hud.sleeping .dot {
        background: #f0b232;
      }
      .badges {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .tag {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #b5bac1;
        max-width: 130px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tag.ok {
        color: #6ce59f;
        background: rgba(35, 165, 90, 0.18);
      }
      .tag.accent {
        color: #c2c9ff;
        background: rgba(88, 101, 242, 0.25);
      }
      .dest-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: #c2c9ff;
        background: rgba(88, 101, 242, 0.14);
        border-radius: 6px;
        padding: 3px 8px;
      }
      .meter {
        height: 3px;
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #23a55a, #5865f2);
        transition: width 0.04s linear;
      }
      .draft {
        font-size: 13px;
        line-height: 1.38;
        color: #ffffff;
        min-height: 19px;
        max-height: 38px;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: break-word;
      }
      .draft.empty {
        color: #949ba4;
        font-size: 11.5px;
      }
      .confirm-box {
        display: none;
        background: rgba(88, 101, 242, 0.28);
        border: 1px solid #5865f2;
        border-radius: 7px;
        padding: 5px 8px;
        font-size: 11.5px;
        line-height: 1.35;
      }
      .confirm-box.show {
        display: block;
      }
      .confirm-box b {
        display: block;
        color: #ffffff;
      }
      .confirm-box span {
        font-size: 10px;
        color: #d6dbff;
      }
      .footer-hint {
        font-size: 10px;
        color: #949ba4;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div id="hud" class="hud">
      <div class="hud-header" id="hudDrag">
        <div class="state-group">
          <span class="dot"></span>
          <span id="stateLabel">停止中 (OFF)</span>
        </div>
        <div class="badges">
          <span id="ncTag" class="tag ok">NC</span>
          <span id="targetTag" class="tag">待機中</span>
        </div>
      </div>
      <div class="dest-row">
        <span id="destLabel">宛先: 現在の画面（未指定）</span>
        <span id="modeLabel">ドラフト</span>
      </div>
      <div class="meter"><div id="meterFill" class="meter-fill"></div></div>
      <div id="confirmBox" class="confirm-box">
        <b id="confirmTitle"></b>
        <span id="confirmSub"></span>
      </div>
      <div id="draftText" class="draft empty">下書きは空です</div>
      <div class="footer-hint">
        <span id="actionHint">「合言葉 〇〇」で宛先切替 / 「送信して」で送信</span>
      </div>
    </div>
    <script>
      (function () {
        const hud = document.getElementById("hud");
        const stateLabel = document.getElementById("stateLabel");
        const ncTag = document.getElementById("ncTag");
        const targetTag = document.getElementById("targetTag");
        const destLabel = document.getElementById("destLabel");
        const meterFill = document.getElementById("meterFill");
        const draftText = document.getElementById("draftText");
        const confirmBox = document.getElementById("confirmBox");
        const confirmTitle = document.getElementById("confirmTitle");
        const confirmSub = document.getElementById("confirmSub");
        const modeLabel = document.getElementById("modeLabel");
        const actionHint = document.getElementById("actionHint");

        document.getElementById("hudDrag").addEventListener("mousedown", function () {
          if (window.ipc && typeof window.ipc.postMessage === "function") {
            window.ipc.postMessage(JSON.stringify({ type: "DragOverlay" }));
          }
        });

        window.onBackendEvent = function (ev) {
          if (!ev || !ev.type) return;
          switch (ev.type) {
            case "AudioLevel": {
              const pct = Math.min(100, Math.round((ev.rms / 0.2) * 100));
              meterFill.style.width = pct + "%";
              if (ev.is_speaking) {
                hud.classList.add("speaking");
              }
              ncTag.textContent = ev.rnnoise_active ? "RNNoise" : "NC OFF";
              ncTag.className = "tag " + (ev.rnnoise_active ? "ok" : "");
              break;
            }
            case "TranscriptUpdate": {
              const text = (ev.draft || "").trim();
              if (text) {
                draftText.textContent = text;
                draftText.classList.remove("empty");
              } else {
                draftText.textContent = "下書きは空です";
                draftText.classList.add("empty");
              }
              break;
            }
            case "ConfirmationPrompt": {
              if (ev.active) {
                confirmTitle.textContent = ev.title || "";
                confirmSub.textContent = ev.subtitle || "";
                confirmBox.classList.add("show");
              } else {
                confirmBox.classList.remove("show");
              }
              break;
            }
            case "CommandExecuted": {
              actionHint.textContent = ev.detail || "コマンド実行";
              setTimeout(() => {
                actionHint.textContent = "「合言葉 〇〇」で宛先切替 / 「送信して」で送信";
              }, 2600);
              break;
            }
            case "StatusChanged": {
              hud.classList.remove("listening", "speaking", "sleeping");
              if (!ev.listening) {
                stateLabel.textContent = "停止中 (OFF)";
              } else if (ev.sleeping) {
                hud.classList.add("sleeping");
                stateLabel.textContent = "スリープ中";
              } else if (ev.recognizing) {
                hud.classList.add("speaking");
                stateLabel.textContent = "認識中...";
              } else {
                hud.classList.add("listening");
                stateLabel.textContent = "録音待機中";
              }

              ncTag.textContent = ev.rnnoise_enabled ? "RNNoise" : "NC OFF";
              ncTag.className = "tag " + (ev.rnnoise_enabled ? "ok" : "");

              targetTag.textContent = ev.active_process || "未検出";
              targetTag.className = "tag " + (ev.target_active ? "ok" : "");

              destLabel.textContent = "宛先: " + (ev.active_discord_target_label || "現在の画面");
              modeLabel.textContent =
                ev.input_mode === "direct" ? "ダイレクト" : "ドラフト";
              break;
            }
          }
        };
      })();
    </script>
  </body>
</html>
